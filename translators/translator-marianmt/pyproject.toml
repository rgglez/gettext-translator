[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-marianmt"
version = "0.0.1"
description = "MarianMT implementation for translator-service"
authors = [{ name="Rodolfo González González", email="github@rodolfo.gg" }]
readme = "README.md"
license = { text = "Apache 2.0" }
dependencies = [
    "translator-service>=0.0.1"
]

[project.entry-points."translator_service.plugins"]
marianmt = "translator_marianmt:TranslatorMarianMT"
