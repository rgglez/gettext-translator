[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gettext-translator-service"
version = "0.1.1"
description = "Core library with plugin interface for the translation services for gettext-translator"
authors = [{ name = "Rodolfo González González", email = "code@rodolfo.gg" }]
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.LESSER"]
requires-python = ">=3.12"
dependencies = [
    "rich>=13",
    "language-data>=1.1",
]

[project.urls]
Homepage = "https://github.com/rgglez/gettext-translator"
Issues = "https://github.com/rgglez/gettext-translator/issues"
