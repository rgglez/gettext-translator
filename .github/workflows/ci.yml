name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The local backends (marianmt, nllb) are left out: they pull torch
      - run: >
          pip install ./translators/gettext-translator-service .
          ./translators/gettext-translator-azure ./translators/gettext-translator-chatgpt
          ./translators/gettext-translator-gemini ./translators/gettext-translator-ollama
          pytest ruff
      - run: ruff check .
      - run: pytest
