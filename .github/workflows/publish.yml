name: Publish

# Tag vX.Y.Z publishes to PyPI. Run it by hand to publish to TestPyPI first.
# Each package must be registered as a (pending) trusted publisher for this
# workflow on pypi.org / test.pypi.org. Already published versions are skipped,
# so only the packages whose version was bumped are uploaded.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      index:
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: |
          python -m build . --outdir dist
          for package in translators/*/; do python -m build "$package" --outdir dist; done
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.index || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true
